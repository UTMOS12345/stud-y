{% load static i18n %}
<!DOCTYPE html>
<html lang="en" data-theme="studyTheme">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}stud-y{% endblock %}</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital@1&family=Geist+Mono:wght@300;400;500&family=Share+Tech+Mono&display=swap"
        rel="stylesheet">

    <!-- Compiled Tailwind CSS with DaisyUI (from input.css) -->
    <link rel="stylesheet" href="{% static 'css/src/output.css' %}">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    {% block head %}{% endblock %}
</head>

<body class="bg-base-100 text-base-content font-mono font-light h-screen flex overflow-hidden scrollbar-thin">
    {% include "includes/sidebar.html" %}

    <div class="flex-1 flex flex-col min-w-0 overflow-hidden relative z-10">
        {% include "includes/topbar.html" %}

        <main id="main-content" class="flex-1 overflow-y-auto overflow-x-hidden">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
        lucide.createIcons();
    </script>

    {% block scripts %}{% endblock %}
</body>

</html>
