{% load i18n %}

<div class="p-12 animate-up">
    <div class="max-w-2xl">
        <!-- Header -->
        <div class="mb-10">
            <h1 class="text-[32px] font-serif italic font-bold text-base-content mb-2">
                profile
            </h1>
            <p class="text-[12px] text-neutral-content tracking-[0.1em] uppercase">
                manage your profile information
            </p>
        </div>

        <!-- Profile Card -->
        <div class="bg-base-300 border border-neutral rounded-xl p-8 mb-10">
            <div class="flex items-center gap-6 mb-8">
                <div class="w-20 h-20 rounded-full bg-neutral flex items-center justify-center flex-shrink-0">
                    <span class="text-[32px] font-bold text-primary">
                        {{ user.username|first|upper }}
                    </span>
                </div>
                <div>
                    <h2 class="text-[18px] font-semibold text-base-content mb-1">
                        {{ user.username }}
                    </h2>
                    <p class="text-[13px] text-neutral-content">
                        {{ user.email }}
                    </p>
                    <p class="text-[11px] text-neutral-content/60 mt-2">
                        Joined {{ user.date_joined|date:"M d, Y" }}
                    </p>
                </div>
            </div>
        </div>

        <!-- Profile Form -->
        <form method="POST" action="{% url 'settings:profile' %}" class="space-y-8">
            {% csrf_token %}

            <!-- Personal Information Section -->
            <section>
                <div class="flex items-center gap-4 mb-6">
                    <h3 class="text-[14px] text-primary tracking-[0.12em] uppercase font-semibold">
                        personal information
                    </h3>
                    <div class="flex-1 h-px bg-neutral/30"></div>
                </div>

                <div class="space-y-5">
                    <!-- First Name -->
                    <div>
                        <label for="first_name"
                            class="block text-[11px] text-neutral-content tracking-[0.08em] uppercase mb-3">
                            first name
                        </label>
                        <input type="text" id="first_name" name="first_name" value="{{ user.first_name }}" class="w-full px-4 py-3 rounded-lg bg-base-200 border border-neutral
                                      focus:border-primary/50 text-base-content text-[13px] font-light
                                      transition-colors focus:outline-none focus:ring-1 focus:ring-primary/20"
                            placeholder="Your first name" />
                    </div>

                    <!-- Last Name -->
                    <div>
                        <label for="last_name"
                            class="block text-[11px] text-neutral-content tracking-[0.08em] uppercase mb-3">
                            last name
                        </label>
                        <input type="text" id="last_name" name="last_name" value="{{ user.last_name }}" class="w-full px-4 py-3 rounded-lg bg-base-200 border border-neutral
                                      focus:border-primary/50 text-base-content text-[13px] font-light
                                      transition-colors focus:outline-none focus:ring-1 focus:ring-primary/20"
                            placeholder="Your last name" />
                    </div>

                    <!-- Email (Read-only) -->
                    <div>
                        <label for="email"
                            class="block text-[11px] text-neutral-content tracking-[0.08em] uppercase mb-3">
                            email address
                        </label>
                        <input type="email" id="email" value="{{ user.email }}" disabled class="w-full px-4 py-3 rounded-lg bg-base-200 border border-neutral
                                      text-base-content text-[13px] font-light cursor-not-allowed opacity-60" />
                        <p class="text-[10px] text-neutral-content/60 mt-2">
                            email cannot be changed. contact support if needed.
                        </p>
                    </div>
                </div>
            </section>

            <!-- Bio Section -->
            <section>
                <div class="flex items-center gap-4 mb-6">
                    <h3 class="text-[14px] text-primary tracking-[0.12em] uppercase font-semibold">
                        about you
                    </h3>
                    <div class="flex-1 h-px bg-neutral/30"></div>
                </div>

                <div>
                    <label for="bio" class="block text-[11px] text-neutral-content tracking-[0.08em] uppercase mb-3">
                        bio
                    </label>
                    <textarea id="bio" name="bio" rows="4" maxlength="500"
                        placeholder="Tell us about yourself (optional)"
                        class="w-full px-4 py-3 rounded-lg bg-base-200 border border-neutral
                                     focus:border-primary/50 text-base-content text-[13px] font-light
                                     transition-colors focus:outline-none focus:ring-1 focus:ring-primary/20 resize-none">{{ profile.bio|default:"" }}</textarea>
                    <p class="text-[10px] text-neutral-content/60 mt-2">
                        max 500 characters
                    </p>
                </div>
            </section>

            <!-- Action Buttons -->
            <div class="flex gap-4 pt-8 border-t border-neutral/50">
                <button type="submit" class="px-8 py-3 rounded-lg bg-primary text-primary-content
                               text-[13px] font-semibold tracking-[0.05em]
                               hover:bg-primary/90 transition-colors">
                    save changes
                </button>
                <button type="reset" class="px-8 py-3 rounded-lg border border-neutral text-neutral-content
                               text-[13px] font-semibold tracking-[0.05em]
                               hover:border-neutral-content/40 hover:text-base-content transition-colors">
                    reset
                </button>
            </div>
        </form>
    </div>
</div>
