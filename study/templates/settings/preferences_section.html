{% load i18n %}

<div class="p-8 max-w-2xl">
    <div class="mb-8">
        <h1 class="text-2xl font-semibold text-base-content mb-2">Preferences</h1>
        <p class="text-sm text-neutral-content">Customize your experience</p>
    </div>

    <form method="POST" class="space-y-8">
        {% csrf_token %}

        <!-- Theme Preference Section -->
        <div class="bg-base-200 rounded-lg p-6 border border-neutral/20">
            <h2 class="text-lg font-semibold text-base-content mb-4 flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="3" />
                    <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
                </svg>
                Theme
            </h2>

            <p class="text-sm text-neutral-content mb-4">
                Choose how the interface appears
            </p>

            <div class="space-y-3">
                <!-- Dark Theme Option -->
                <label class="flex items-center gap-4 p-4 rounded-lg border-2 cursor-pointer transition-all {% if profile.theme_preference == 'dark' %}border-primary bg-base-300/50{% else %}border-neutral/20 hover:border-neutral/40 bg-base-100/50{% endif %}">
                    <input type="radio" name="theme_preference" value="dark" {% if profile.theme_preference == 'dark' %}checked{% endif %} class="w-5 h-5 accent-primary cursor-pointer" onchange="updateThemePreview('dark')">
                    <div class="flex-1">
                        <p class="font-medium text-base-content">Dark Theme</p>
                        <p class="text-xs text-neutral-content">Best for night time</p>
                    </div>
                    <div class="w-8 h-8 rounded-lg bg-[#09100e] border border-neutral"></div>
                </label>

                <!-- Light Theme Option -->
                <label class="flex items-center gap-4 p-4 rounded-lg border-2 cursor-pointer transition-all {% if profile.theme_preference == 'light' %}border-primary bg-base-300/50{% else %}border-neutral/20 hover:border-neutral/40 bg-base-100/50{% endif %}">
                    <input type="radio" name="theme_preference" value="light" {% if profile.theme_preference == 'light' %}checked{% endif %} class="w-5 h-5 accent-primary cursor-pointer" onchange="updateThemePreview('light')">
                    <div class="flex-1">
                        <p class="font-medium text-base-content">Light Theme</p>
                        <p class="text-xs text-neutral-content">Best for daytime</p>
                    </div>
                    <div class="w-8 h-8 rounded-lg bg-[#f4fbf8] border border-[#dae8e1]"></div>
                </label>

                <!-- System Theme Option -->
                <label class="flex items-center gap-4 p-4 rounded-lg border-2 cursor-pointer transition-all {% if profile.theme_preference == 'system' %}border-primary bg-base-300/50{% else %}border-neutral/20 hover:border-neutral/40 bg-base-100/50{% endif %}">
                    <input type="radio" name="theme_preference" value="system" {% if profile.theme_preference == 'system' %}checked{% endif %} class="w-5 h-5 accent-primary cursor-pointer" onchange="updateThemePreview('system')">
                    <div class="flex-1">
                        <p class="font-medium text-base-content">System Preference</p>
                        <p class="text-xs text-neutral-content">Follow your device settings</p>
                    </div>
                    <svg class="w-6 h-6 text-neutral-content" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <rect x="2" y="3" width="20" height="14" rx="2" ry="2" />
                        <line x1="8" y1="21" x2="16" y2="21" />
                        <line x1="12" y1="17" x2="12" y2="21" />
                    </svg>
                </label>
            </div>

            <div class="mt-4 p-3 bg-primary/10 rounded-lg border border-primary/20">
                <p class="text-xs text-primary flex items-center gap-2">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M18 5v8a2 2 0 01-2 2h-5l-5 4v-4H4a2 2 0 01-2-2V5a2 2 0 012-2h12a2 2 0 012 2z" clip-rule="evenodd" />
                    </svg>
                    Theme changes apply immediately
                </p>
            </div>
        </div>

        <!-- Timezone Section -->
        <div class="bg-base-200 rounded-lg p-6 border border-neutral/20">
            <h2 class="text-lg font-semibold text-base-content mb-4 flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" />
                    <polyline points="12 6 12 12 16 14" />
                </svg>
                Timezone
            </h2>

            <select name="timezone" class="w-full px-4 py-2 rounded-lg bg-base-100 border border-neutral text-base-content">
                {% for tz in timezones %}
                    <option value="{{ tz }}" {% if profile.timezone == tz %}selected{% endif %}>{{ tz }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Language Section -->
        <div class="bg-base-200 rounded-lg p-6 border border-neutral/20">
            <h2 class="text-lg font-semibold text-base-content mb-4 flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
                </svg>
                Language
            </h2>

            <select name="language_preference" class="w-full px-4 py-2 rounded-lg bg-base-100 border border-neutral text-base-content">
                {% for code, name in languages %}
                <option value="{{ code }}" {% if profile.language_preference == code %}selected{% endif %}>{{ name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Save Button -->
        <div class="flex gap-4 pt-6">
            <button type="submit" class="px-6 py-3 bg-primary text-primary-content rounded-lg font-medium hover:bg-primary/80 transition-colors flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
                Save Preferences
            </button>
            <a href="{% url 'settings:profile' %}" class="px-6 py-3 bg-base-200 text-base-content rounded-lg font-medium hover:bg-base-300 transition-colors">
                Cancel
            </a>
        </div>
    </form>
</div>

<script>
    function updateThemePreview(theme) {
        const themeMap = {
            'light': 'studyLight',
            'dark': 'studyTheme',
            'system': window.matchMedia('(prefers-color-scheme: dark)').matches ? 'studyTheme' : 'studyLight'
        };
        
        document.documentElement.setAttribute('data-theme', themeMap[theme]);
        sessionStorage.setItem('previewTheme', theme);
    }

    document.addEventListener('DOMContentLoaded', function() {
        const tzSelect = document.querySelector('select[name="timezone"]');
        if (tzSelect) {
            const allTimezones = [
                'UTC',
                'Africa/Cairo', 'Africa/Johannesburg', 'Africa/Lagos',
                'America/Anchorage', 'America/Chicago', 'America/Denver', 'America/Los_Angeles', 'America/New_York', 'America/Toronto', 'America/Vancouver',
                'Asia/Bangkok', 'Asia/Dubai', 'Asia/Hong_Kong', 'Asia/Jakarta', 'Asia/Kolkata', 'Asia/Shanghai', 'Asia/Singapore', 'Asia/Tokyo',
                'Australia/Brisbane', 'Australia/Sydney',
                'Europe/Berlin', 'Europe/London', 'Europe/Moscow', 'Europe/Paris',
                'Pacific/Auckland', 'Pacific/Fiji'
            ];
            
            const currentValue = tzSelect.value;
            tzSelect.innerHTML = '';
            allTimezones.forEach(tz => {
                const option = document.createElement('option');
                option.value = tz;
                option.textContent = tz;
                if (tz === currentValue) option.selected = true;
                tzSelect.appendChild(option);
            });
        }
    });
</script>
