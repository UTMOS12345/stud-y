{% load i18n %}

<div class="p-12 animate-up">
    <div class="max-w-2xl">
        <div class="mb-10">
            <h1 class="text-[32px] font-serif italic font-bold text-base-content mb-2">
                preferences
            </h1>
            <p class="text-[12px] text-neutral-content tracking-[0.1em] uppercase">
                customize your experience
            </p>
        </div>

        <form method="POST" action="{% url 'settings:preferences' %}" class="space-y-8">
            {% csrf_token %}

            <section>
                <div class="flex items-center gap-4 mb-6">
                    <h3 class="text-[14px] text-primary tracking-[0.12em] uppercase font-semibold">
                        appearance
                    </h3>
                    <div class="flex-1 h-px bg-neutral/30"></div>
                </div>

                <div class="space-y-3">
                    <label class="flex items-center gap-3 cursor-pointer group p-3 rounded-lg hover:bg-base-300 transition-colors">
                        <input type="radio" name="theme_preference" value="dark" {% if profile.theme_preference == 'dark' %}checked="checked"{% endif %} class="w-4 h-4 accent-primary cursor-pointer" />
                        <div class="flex-1">
                            <p class="text-[13px] text-base-content group-hover:text-primary transition-colors font-medium">
                                dark mode
                            </p>
                            <p class="text-[11px] text-neutral-content/60">easy on the eyes for night sessions</p>
                        </div>
                    </label>

                    <label class="flex items-center gap-3 cursor-pointer group p-3 rounded-lg hover:bg-base-300 transition-colors">
                        <input type="radio" name="theme_preference" value="light" {% if profile.theme_preference == 'light' %}checked="checked"{% endif %} class="w-4 h-4 accent-primary cursor-pointer" />
                        <div class="flex-1">
                            <p class="text-[13px] text-base-content group-hover:text-primary transition-colors font-medium">
                                light mode
                            </p>
                            <p class="text-[11px] text-neutral-content/60">bright and clean interface</p>
                        </div>
                    </label>

                    <label class="flex items-center gap-3 cursor-pointer group p-3 rounded-lg hover:bg-base-300 transition-colors">
                        <input type="radio" name="theme_preference" value="system" {% if profile.theme_preference == 'system' %}checked="checked"{% endif %} class="w-4 h-4 accent-primary cursor-pointer" />
                        <div class="flex-1">
                            <p class="text-[13px] text-base-content group-hover:text-primary transition-colors font-medium">
                                system
                            </p>
                            <p class="text-[11px] text-neutral-content/60">follow your device settings</p>
                        </div>
                    </label>
                </div>
            </section>

            <section>
                <div class="flex items-center gap-4 mb-6">
                    <h3 class="text-[14px] text-primary tracking-[0.12em] uppercase font-semibold">
                        location & language
                    </h3>
                    <div class="flex-1 h-px bg-neutral/30"></div>
                </div>

                <div class="space-y-5">
                    <div>
                        <label for="timezone" class="block text-[11px] text-neutral-content tracking-[0.08em] uppercase mb-3">
                            timezone
                        </label>
                        <select id="timezone" name="timezone" class="w-full px-4 py-3 rounded-lg bg-base-200 border border-neutral focus:border-primary/50 text-base-content text-[13px] font-light transition-colors focus:outline-none focus:ring-1 focus:ring-primary/20">
                            <option value="UTC" {% if profile.timezone == 'UTC' %}selected="selected"{% endif %}>UTC</option>
                            <option value="US/Eastern" {% if profile.timezone == 'US/Eastern' %}selected="selected"{% endif %}>US/Eastern</option>
                            <option value="US/Central" {% if profile.timezone == 'US/Central' %}selected="selected"{% endif %}>US/Central</option>
                            <option value="US/Mountain" {% if profile.timezone == 'US/Mountain' %}selected="selected"{% endif %}>US/Mountain</option>
                            <option value="US/Pacific" {% if profile.timezone == 'US/Pacific' %}selected="selected"{% endif %}>US/Pacific</option>
                            <option value="Europe/London" {% if profile.timezone == 'Europe/London' %}selected="selected"{% endif %}>Europe/London</option>
                            <option value="Europe/Paris" {% if profile.timezone == 'Europe/Paris' %}selected="selected"{% endif %}>Europe/Paris</option>
                            <option value="Europe/Berlin" {% if profile.timezone == 'Europe/Berlin' %}selected="selected"{% endif %}>Europe/Berlin</option>
                            <option value="Asia/Tokyo" {% if profile.timezone == 'Asia/Tokyo' %}selected="selected"{% endif %}>Asia/Tokyo</option>
                            <option value="Asia/Shanghai" {% if profile.timezone == 'Asia/Shanghai' %}selected="selected"{% endif %}>Asia/Shanghai</option>
                            <option value="Asia/Singapore" {% if profile.timezone == 'Asia/Singapore' %}selected="selected"{% endif %}>Asia/Singapore</option>
                            <option value="Australia/Sydney" {% if profile.timezone == 'Australia/Sydney' %}selected="selected"{% endif %}>Australia/Sydney</option>
                        </select>
                    </div>

                    <div>
                        <label for="language" class="block text-[11px] text-neutral-content tracking-[0.08em] uppercase mb-3">
                            language
                        </label>
                        <select id="language" name="language_preference" class="w-full px-4 py-3 rounded-lg bg-base-200 border border-neutral focus:border-primary/50 text-base-content text-[13px] font-light transition-colors focus:outline-none focus:ring-1 focus:ring-primary/20">
                            <option value="en" {% if profile.language_preference == 'en' %}selected="selected"{% endif %}>English</option>
                            <option value="es" {% if profile.language_preference == 'es' %}selected="selected"{% endif %}>Español</option>
                            <option value="fr" {% if profile.language_preference == 'fr' %}selected="selected"{% endif %}>Français</option>
                            <option value="de" {% if profile.language_preference == 'de' %}selected="selected"{% endif %}>Deutsch</option>
                            <option value="ja" {% if profile.language_preference == 'ja' %}selected="selected"{% endif %}>日本語</option>
                            <option value="zh" {% if profile.language_preference == 'zh' %}selected="selected"{% endif %}>中文</option>
                        </select>
                    </div>
                </div>
            </section>

            <section>
                <div class="flex items-center gap-4 mb-6">
                    <h3 class="text-[14px] text-primary tracking-[0.12em] uppercase font-semibold">
                        integrations
                    </h3>
                    <div class="flex-1 h-px bg-neutral/30"></div>
                </div>

                <label class="flex items-center gap-3 cursor-pointer group p-4 rounded-lg border border-neutral hover:border-primary/30 hover:bg-base-300 transition-all">
                    <input type="checkbox" name="google_sync_enabled" {% if profile.google_sync_enabled %}checked="checked"{% endif %} class="w-4 h-4 accent-primary cursor-pointer rounded" />
                    <div class="flex-1">
                        <p class="text-[13px] text-base-content group-hover:text-primary transition-colors font-medium">
                            sync with google calendar
                        </p>
                        <p class="text-[11px] text-neutral-content/60 mt-1">
                            automatically sync your schedules and events
                        </p>
                    </div>
                </label>
            </section>

            <div class="flex gap-4 pt-8 border-t border-neutral/50">
                <button type="submit" class="px-8 py-3 rounded-lg bg-primary text-primary-content text-[13px] font-semibold tracking-[0.05em] hover:bg-primary/90 transition-colors">
                    save changes
                </button>
                <button type="reset" class="px-8 py-3 rounded-lg border border-neutral text-neutral-content text-[13px] font-semibold tracking-[0.05em] hover:border-neutral-content/40 hover:text-base-content transition-colors">
                    reset
                </button>
            </div>
        </form>
    </div>
</div>
