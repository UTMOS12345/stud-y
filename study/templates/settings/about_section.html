{% load i18n %}

<div class="p-12 animate-up">
    <div class="max-w-2xl">
        <!-- Header -->
        <div class="mb-10">
            <h1 class="text-[32px] font-serif italic font-bold text-base-content mb-2">
                about
            </h1>
            <p class="text-[12px] text-neutral-content tracking-[0.1em] uppercase">
                about stud-y
            </p>
        </div>

        <!-- App Info -->
        <section class="mb-10">
            <div class="bg-base-300 border border-neutral rounded-xl p-8 text-center">
                <h2 class="text-[32px] font-serif italic font-bold text-primary mb-4">
                    stud-y
                </h2>
                <p class="text-[13px] text-neutral-content mb-6">
                    focus on what matters. a simple pomodoro timer for productivity.
                </p>

                <div class="space-y-3">
                    <div>
                        <p class="text-[11px] text-neutral-content/60 tracking-[0.05em] uppercase">version</p>
                        <p class="text-[16px] font-semibold text-base-content">v0.1.0</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Links Section -->
        <section>
            <div class="flex items-center gap-4 mb-6">
                <h3 class="text-[14px] text-primary tracking-[0.12em] uppercase font-semibold">
                    links
                </h3>
                <div class="flex-1 h-px bg-neutral/30"></div>
            </div>

            <div class="space-y-2">
                <a href="#" class="flex items-center gap-3 p-3 rounded-lg hover:bg-base-300 transition-colors group">
                    <svg class="w-5 h-5 text-neutral-content/60 group-hover:text-primary transition-colors"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                        <polyline points="9 22 9 12 15 12 15 22" />
                    </svg>
                    <span class="text-[13px] text-neutral-content group-hover:text-primary transition-colors">
                        privacy policy
                    </span>
                </a>

                <a href="#" class="flex items-center gap-3 p-3 rounded-lg hover:bg-base-300 transition-colors group">
                    <svg class="w-5 h-5 text-neutral-content/60 group-hover:text-primary transition-colors"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" />
                        <polyline points="12 6 12 12 16 14" />
                    </svg>
                    <span class="text-[13px] text-neutral-content group-hover:text-primary transition-colors">
                        terms of service
                    </span>
                </a>
            </div>

            <p class="text-[11px] text-neutral-content/50 mt-8 pt-8 border-t border-neutral/30">
                © 2024 stud-y. all rights reserved.
            </p>
        </section>
    </div>
</div>
