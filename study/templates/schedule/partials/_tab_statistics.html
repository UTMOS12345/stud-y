<h2 class="font-serif italic font-bold text-base-content mb-12" style="font-size: 42px; letter-spacing: -1px;">
    Statistics</h2>
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-12">
    <div
        class="bg-base-300 border border-neutral p-8 rounded-2xl shadow-lg hover:border-primary/20 transition-colors group">
        <div class="flex items-center justify-between mb-4">
            <p class="text-[10px] text-neutral-content uppercase tracking-[0.2em] font-bold">Total Time</p>
            <i data-lucide="clock"
                class="w-4 h-4 text-primary opacity-40 group-hover:opacity-100 transition-opacity"></i>
        </div>
        <p class="text-4xl font-mono font-bold text-base-content mb-2">124h</p>
        <div class="flex items-center gap-2">
            <span class="text-[10px] px-2 py-0.5 rounded-full bg-primary/10 text-primary font-bold">+5.2%</span>
            <span class="text-[10px] text-neutral-content/60 font-medium uppercase tracking-widest">this month</span>
        </div>
    </div>
    <div
        class="bg-base-300 border border-neutral p-8 rounded-2xl shadow-lg hover:border-primary/20 transition-colors group">
        <div class="flex items-center justify-between mb-4">
            <p class="text-[10px] text-neutral-content uppercase tracking-[0.2em] font-bold">Daily Average</p>
            <i data-lucide="trending-up"
                class="w-4 h-4 text-primary opacity-40 group-hover:opacity-100 transition-opacity"></i>
        </div>
        <p class="text-4xl font-mono font-bold text-base-content mb-2">6.2h</p>
        <div class="flex items-center gap-2">
            <span class="text-[10px] px-2 py-0.5 rounded-full bg-primary/10 text-primary font-bold">+12%</span>
            <span class="text-[10px] text-neutral-content/60 font-medium uppercase tracking-widest">vs last week</span>
        </div>
    </div>
</div>
