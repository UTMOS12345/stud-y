<!-- Add/Edit Block Modal -->
<div id="addBlockModal"
    class="fixed inset-0 z-[1000] hidden flex items-center justify-center bg-base-100/90 backdrop-blur-md p-4">

    <!-- Modal Box -->
    <div
        class="bg-base-200 border-2 border-primary/20 w-full max-w-md rounded-[2.5rem] p-10 shadow-[0_0_50px_rgba(77,255,170,0.15)] animate-up">

        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <h2 id="modal-title" class="text-2xl font-bold text-primary uppercase tracking-[0.3em] font-mono">
                Block_Editor</h2>
            <button onclick="closeModal()" class="text-base-content hover:text-primary transition-colors">
                <i data-lucide="x-circle" class="w-8 h-8"></i>
            </button>
        </div>

        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="block_id" id="id_block_id" value="">

            <div class="space-y-6">
                <!-- Action Selection -->
                <div>
                    <label
                        class="text-[10px] uppercase text-base-content font-black tracking-[0.2em] mb-2 block ml-1">Action</label>
                    <div class="flex flex-wrap gap-3 mb-2" id="action-bubbles-container">
                        {% for action in actions %}
                        <div class="relative group">
                            <button type="button"
                                class="action-select-btn flex items-center gap-2 px-4 py-2 rounded-full border-2 transition-all duration-300 opacity-70 hover:opacity-100"
                                style="border-color: {{ action.color }}; color: {{ action.color }};"
                                data-value="{{ action.id }}" onclick="selectAction(this, '{{ action.id }}')">
                                <i data-lucide="{{ action.icon_name }}" class="w-4 h-4"></i>
                                <span class="font-bold text-sm">{{ action.name }}</span>
                            </button>
                        </div>
                        {% endfor %}
                    </div>
                    <!-- Hidden input for Django form -->
                    <input type="hidden" name="action" id="id_action" required>
                </div>

                <!-- Title -->
                <div>
                    <label
                        class="text-[10px] uppercase text-base-content font-black tracking-[0.2em] mb-2 block ml-1">Title</label>
                    <input type="text" name="title" id="id_title" required
                        class="w-full bg-base-300 border border-neutral/20 rounded-lg p-3 text-primary font-mono focus:outline-none focus:ring-1 focus:ring-primary/50">
                </div>

                <!-- Time Grid -->
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label
                            class="text-[10px] uppercase text-base-content font-black tracking-[0.2em] mb-2 block text-center">T_START</label>
                        <input type="time" name="start_time" id="id_start_time" required
                            class="w-full bg-base-300 border border-neutral/20 rounded-lg p-3 text-center">
                    </div>
                    <div>
                        <label
                            class="text-[10px] uppercase text-base-content font-black tracking-[0.2em] mb-2 block text-center">T_END</label>
                        <input type="time" name="end_time" id="id_end_time" required
                            class="w-full bg-base-300 border border-neutral/20 rounded-lg p-3 text-center">
                    </div>
                </div>

                <!-- Block Type -->
                <div>
                    <label
                        class="text-[10px] uppercase text-base-content font-black tracking-[0.2em] mb-2 block ml-1">Type</label>
                    <select name="block_type" id="id_block_type"
                        class="w-full bg-base-300 border border-neutral/20 rounded-lg p-3">
                        <option value="fixed">Fixed</option>
                        <option value="flexible">Flexible</option>
                    </select>
                </div>

                <!-- Description -->
                <div>
                    <label
                        class="text-[10px] uppercase text-base-content font-black tracking-[0.2em] mb-2 block ml-1">Description</label>
                    <textarea name="description" id="id_description" rows="3"
                        class="w-full bg-base-300 border border-neutral/20 rounded-lg p-3"></textarea>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-col gap-3 mt-10">
                <button type="submit"
                    class="w-full py-4 rounded-2xl border border-primary text-primary-content font-bold uppercase tracking-[0.2em] hover:bg-primary/10 transition-all bg-primary">
                    Save
                </button>
                <button type="button" onclick="closeModal()"
                    class="w-full py-4 rounded-2xl border border-base-400 text-base-content font-bold uppercase tracking-[0.2em] hover:bg-base-300/10 transition-all">
                    Cancel
                </button>
            </div>
        </form>
    </div>
</div>
