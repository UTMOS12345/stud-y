<!-- schedule/partials/_tab_templates.html -->
<div class="w-full max-w-7xl mx-auto space-y-12">

    <!-- Header Section -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-end gap-6 mb-12">
        <div>
            <h2 class="text-4xl font-bold tracking-[0.2em] uppercase text-primary font-mono">My_Templates</h2>
            <p class="text-base-500 font-bold tracking-widest uppercase mt-2">Saved Routines & Frameworks</p>
        </div>

        <!-- Redirects user to schedule tab and opens the modal to save current day as template -->
        <button onclick="switchTab('schedule'); openConvertTemplateModal();"
            class="group flex items-center gap-3 px-8 py-4 rounded-2xl border-2 border-primary text-primary font-black uppercase tracking-widest hover:bg-primary hover:text-primary-content transition-all duration-300 shadow-lg shadow-primary/10">
            <i data-lucide="plus-circle" class="w-6 h-6"></i>
            Create From Today
        </button>
    </div>

    <!-- Templates Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        {% for template in templates %}
        <div
            class="bg-base-200 rounded-[2.5rem] p-10 border border-base-300/50 hover:border-primary/40 transition-all duration-500 group shadow-xl flex flex-col h-full">

            <!-- Card Header -->
            <div class="flex justify-between items-start mb-8">
                <div
                    class="w-16 h-16 bg-primary/10 rounded-2xl flex items-center justify-center text-primary border border-primary/20 group-hover:scale-110 transition-transform duration-500">
                    <i data-lucide="layout-template" class="w-8 h-8"></i>
                </div>

                <button onclick="deleteTemplate({{ template.id }}, '{{ template.name|escapejs }}')"
                    class="p-3 bg-base-300 rounded-xl text-base-content/20 hover:text-error hover:bg-error/10 transition-all"
                    title="Delete Template">
                    <i data-lucide="trash-2" class="w-6 h-6"></i>
                </button>
            </div>

            <!-- Template Info -->
            <div class="flex-1">
                <h3 class="text-3xl font-bold text-base-content tracking-tight mb-3">
                    {{ template.name }}
                </h3>

                <div class="flex items-center gap-4 text-base-500 font-bold uppercase tracking-[0.1em] text-sm">
                    <span class="flex items-center gap-2">
                        <i data-lucide="layers" class="w-4 h-4"></i>
                        {{ template.template_blocks.count }} Blocks
                    </span>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="mt-10 flex gap-3">
                <a href="{% url 'template_detail' template.id %}"
                    class="flex-1 text-center py-4 rounded-2xl bg-primary text-primary-content font-bold uppercase tracking-[0.2em] hover:scale-[1.02] active:scale-95 transition-all shadow-lg shadow-primary/20">
                    Edit Editor
                </a>

                <button onclick="openApplyRange({{ template.id }}, '{{ template.name|escapejs }}')"
                    class="px-5 rounded-2xl border border-primary/30 text-primary hover:bg-primary/10 transition-all"
                    title="Apply to several days">
                    <i data-lucide="calendar-range" class="w-6 h-6"></i>
                </button>

                <button onclick="applyTemplateNow({{ template.id }})"
                    class="px-5 rounded-2xl border border-primary/30 text-primary hover:bg-primary/10 transition-all"
                    title="Apply to today">
                    <i data-lucide="calendar-check" class="w-6 h-6"></i>
                </button>
            </div>
        </div>
        {% empty %}
        <!-- Empty State -->
        <div
            class="col-span-full py-40 text-center bg-base-200/30 rounded-[3rem] border-2 border-dashed border-base-300">
            <div class="opacity-20 italic tracking-[0.5em] text-2xl text-base-500 mb-6 uppercase">No_Templates_Found
            </div>
            <button onclick="switchTab('schedule')"
                class="text-primary font-black uppercase tracking-widest border-b-2 border-primary/30 hover:border-primary transition-all pb-1">
                Go to schedule to save your first template
            </button>
        </div>
        {% endfor %}
    </div>
</div>

<!-- Apply to several days -->
<div id="applyRangeModal" class="hidden fixed inset-0 z-[1000] flex items-center justify-center bg-base-100/90 backdrop-blur-md p-4">
    <div class="bg-base-200 border-2 border-primary/20 w-full max-w-md rounded-[2.5rem] p-10 shadow-[0_0_50px_rgba(77,255,170,0.15)] animate-up">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-bold text-primary uppercase tracking-[0.3em] font-mono">Apply_Days</h2>
            <button type="button" onclick="closeApplyRange()" class="text-base-content hover:text-primary transition-colors">
                <i data-lucide="x-circle" class="w-8 h-8"></i>
            </button>
        </div>

        <p id="applyRangeName" class="text-lg font-bold text-base-content mb-6"></p>

        <label class="text-[10px] uppercase text-base-content font-black tracking-[0.2em] mb-2 block ml-1">Dates</label>
        <input id="applyRangeDates" type="text" placeholder="Pick first and last day"
            class="w-full bg-base-300 border border-neutral/20 rounded-lg p-4 text-primary font-mono focus:outline-none focus:ring-1 focus:ring-primary/50 mb-6">

        <label class="text-[10px] uppercase text-base-content font-black tracking-[0.2em] mb-2 block ml-1">Weekdays</label>
        <div class="grid grid-cols-7 gap-1.5 mb-8" id="applyRangeDays">
            {% for label in "MTWTFSS" %}
            <button type="button" data-day="{{ forloop.counter0 }}" onclick="this.classList.toggle('on')" class="day-chip">{{ label }}</button>
            {% endfor %}
        </div>

        <button type="button" onclick="submitApplyRange()"
            class="w-full py-4 rounded-2xl bg-primary text-primary-content font-bold uppercase tracking-[0.2em] hover:scale-[1.02] active:scale-95 transition-transform">
            Apply
        </button>
    </div>
</div>

<style>
    .day-chip {
        aspect-ratio: 1;
        border-radius: .6rem;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        color: var(--color-neutral-content);
        border: 1px solid color-mix(in srgb, var(--color-neutral-content), transparent 70%);
    }

    .day-chip.on {
        color: var(--color-primary-content);
        background: var(--color-primary);
        border-color: var(--color-primary);
    }
</style>

<script>
    // Re-initialize icons when this partial is rendered or tab is switched
    if (window.lucide) { lucide.createIcons(); }

    /**
     * Delete a template via JSON POST
     */
    async function deleteTemplate(id, name) {
        if (!await askConfirm(`Permanently delete "${name}"?`, { ok: 'Delete', danger: true })) return;

        try {
            const response = await fetch(window.location.href, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({
                    action: 'delete_template',
                    template_id: id
                })
            });

            if (response.ok) {
                window.location.reload();
            } else {
                toast("Error deleting template.", 'error');
            }
        } catch (e) {
            console.error("Delete error:", e);
        }
    }

    let applyRangeId = null;
    let applyRangePicker = null;

    function openApplyRange(id, name) {
        applyRangeId = id;
        document.getElementById('applyRangeName').textContent = name;
        // Monday to Friday is the usual case
        document.querySelectorAll('#applyRangeDays .day-chip').forEach(chip =>
            chip.classList.toggle('on', Number(chip.dataset.day) < 5));
        if (!applyRangePicker) {
            applyRangePicker = flatpickr('#applyRangeDates', { mode: 'range', dateFormat: 'Y-m-d' });
        }
        applyRangePicker.clear();
        document.getElementById('applyRangeModal').classList.remove('hidden');
    }

    function closeApplyRange() {
        document.getElementById('applyRangeModal').classList.add('hidden');
    }

    async function submitApplyRange() {
        const dates = applyRangePicker.selectedDates.map(d => applyRangePicker.formatDate(d, 'Y-m-d'));
        const weekdays = [...document.querySelectorAll('#applyRangeDays .day-chip.on')].map(c => Number(c.dataset.day));
        if (!dates.length) { toast('Pick the dates first', 'error'); return; }
        if (!weekdays.length) { toast('Pick at least one weekday', 'error'); return; }

        const response = await fetch(window.location.href, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
            body: JSON.stringify({
                action: 'apply_template_range',
                template_id: applyRangeId,
                start: dates[0],
                end: dates[dates.length - 1],
                weekdays: weekdays,
            }),
        });
        const data = await response.json();
        if (response.ok) {
            toastAfterReload(data.message);
            window.location.reload();
        } else {
            toast(data.error || 'Could not apply the template', 'error');
        }
    }

    /**
     * Apply a template to the current day immediately
     */
    async function applyTemplateNow(id) {
        if (!await askConfirm("Apply this template to this day's schedule? Overlapping blocks will be skipped.", { ok: 'Apply' })) return;

        try {
            const response = await fetch(window.location.href, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({
                    action: 'apply_template',
                    template_id: id
                })
            });

            if (response.ok) {
                const data = await response.json();
                toastAfterReload(data.message || "Template applied successfully!");
                // Switch back to schedule tab to see changes
                switchTab('schedule');
                window.location.reload();
            }
        } catch (e) {
            console.error("Apply error:", e);
        }
    }
</script>
