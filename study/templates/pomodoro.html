{% extends "base.html" %}
{% load i18n %}

{% block title %}stud-y — pomodoro{% endblock %}

{% block content %}
<div class="h-full w-full flex flex-col items-center justify-center p-4 animate-up relative">

    <!-- The Hero Circular Card -->
    <div class="relative flex items-center justify-center">

        <!-- Outer Glow Layer -->
        <div class="absolute rounded-full opacity-20 blur-[100px] bg-primary w-[540px] h-[540px] pointer-events-none">
        </div>

        <!-- Main Circular Card -->
        <div class="relative flex items-center justify-center rounded-full border border-primary/30 overflow-hidden"
            style="background: rgba(15, 26, 23, 0.75);
                    box-shadow: 0 0 120px rgba(0, 0, 0, 0.5), inset 0 0 80px rgba(77, 255, 170, 0.05);
                    backdrop-filter: blur(24px);
                    width: 540px; height: 540px;">

            <!-- Progress Ring (Concentric) -->
            <svg class="absolute inset-0 w-full h-full -rotate-90 pointer-events-none" viewBox="0 0 540 540">
                <!-- Background Track -->
                <circle cx="270" cy="270" r="255" fill="none" stroke="currentColor" stroke-width="1.5"
                    class="text-primary/10" />
                <!-- Active Progress -->
                <circle id="progress-ring" cx="270" cy="270" r="255" fill="none" stroke="#4dffaa" stroke-width="5"
                    stroke-linecap="round"
                    style="stroke-dasharray: 1602; stroke-dashoffset: 0; transition: stroke-dashoffset 0.5s cubic-bezier(0.4, 0, 0.2, 1); filter: drop-shadow(0 0 15px rgba(77, 255, 170, 0.7))" />
            </svg>

            <!-- Inner Content Layout -->
            <div class="relative z-10 flex flex-col items-center justify-center w-full h-full px-16 text-center">

                <!-- Session Label (Top) -->
                <div class="mb-4">
                    <div id="session-label" class="text-[12px] text-primary/70 tracking-[0.5em] uppercase font-bold"
                        style="text-shadow: 0 0 15px rgba(77, 255, 170, 0.3);">work</div>
                    <div class="text-[9px] text-neutral-content/30 tracking-[0.3em] uppercase mt-1.5">active session
                    </div>
                </div>

                <!-- Timer Display (The Centerpiece) -->
                <div class="my-2">
                    <div id="timer-display" class="font-bold text-primary leading-none"
                        style="font-family: 'Share Tech Mono', monospace; font-size: 140px; letter-spacing: -6px; text-shadow: 0 0 60px rgba(77, 255, 170, 0.5);">
                        25:00
                    </div>
                </div>

                <!-- Controls (Floating Style) -->
                <div class="flex items-center justify-center gap-8 mb-10">
                    <button
                        class="w-11 h-11 rounded-full border border-primary/20 text-primary/40 hover:text-primary hover:border-primary/50 hover:bg-primary/5 transition-all flex items-center justify-center group"
                        title="Settings">
                        <i id="settings-btn" data-lucide="settings"
                            class="w-4 h-4 group-hover:rotate-90 transition-transform duration-500"></i>
                    </button>

                    <button id="start-btn"
                        class="w-20 h-20 rounded-full border-2 border-primary/40 text-primary hover:border-primary hover:bg-primary/10 transition-all active:scale-90 flex items-center justify-center shadow-[0_0_40px_rgba(77,255,170,0.2)] hover:shadow-[0_0_60px_rgba(77,255,170,0.4)] group">
                        <i id="play-icon" data-lucide="play"
                            class="w-9 h-9 fill-primary/10 ml-1 group-hover:fill-primary/30 transition-all"></i>
                        <i id="pause-icon" data-lucide="pause"
                            class="w-9 h-9 fill-primary/10 group-hover:fill-primary/30 transition-all"
                            style="display: none;"></i>
                    </button>

                    <button id="reset-btn"
                        class="w-11 h-11 rounded-full border border-primary/20 text-primary/40 hover:text-primary hover:border-primary/50 hover:bg-primary/5 transition-all flex items-center justify-center group"
                        title="Reset">
                        <i data-lucide="rotate-ccw"
                            class="w-4 h-4 group-hover:-rotate-180 transition-transform duration-500"></i>
                    </button>
                </div>

                <!-- Mode Selector & Stats (Bottom Section) -->
                <div class="flex flex-col items-center gap-8">
                    <div class="flex items-center bg-black/20 rounded-full p-1 border border-primary/10">
                        <button id="work-mode-btn"
                            class="px-7 py-2 rounded-full text-[10px] font-bold tracking-[0.2em] transition-all bg-primary/20 text-primary border border-primary/30">WORK</button>
                        <button id="break-mode-btn"
                            class="px-7 py-2 rounded-full text-[10px] font-bold tracking-[0.2em] transition-all text-neutral-content/40 hover:text-primary/70">BREAK</button>
                    </div>

                    <div class="flex gap-12 items-center justify-center">
                        <div class="text-center">
                            <div class="text-[24px] font-bold text-primary/90 leading-none" id="sessions-count">0</div>
                            <div class="text-[8px] text-primary/30 tracking-[0.2em] uppercase mt-2 font-bold">sessions
                            </div>
                        </div>
                        <div class="w-px h-8 bg-primary/10"></div>
                        <div class="text-center">
                            <div class="text-[24px] font-bold text-primary/90 leading-none" id="time-count">0m</div>
                            <div class="text-[8px] text-primary/30 tracking-[0.2em] uppercase mt-2 font-bold">focused
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer Branding (Integrated) -->
        <div class="absolute -bottom-24 left-1/2 -translate-x-1/2 text-center w-full">
            <h1 class="font-serif italic font-bold text-base-content/80 leading-tight"
                style="font-size: 40px; letter-spacing: -1px;">focus.</h1>
            <p class="text-[10px] text-neutral-content/30 tracking-[0.4em] uppercase mt-2">pomodoro timer system v1.0
            </p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    (function () {
        if (window.lucide) lucide.createIcons();

        let endTime = null;
        let isRunning = false;
        let mode = 'work';
        let sessionsCompleted = 0;
        let totalFocusedSeconds = 0;
        let timerInterval = null;
        let timeLeft;

        const WORK_TIME = 25 * 60;
        const BREAK_TIME = 5 * 60;
        const circumference = 2 * Math.PI * 255;

        const timerDisplay = document.getElementById('timer-display');
        const settingsBtn = document.getElementById('settings-btn');
        const startBtn = document.getElementById('start-btn');
        const resetBtn = document.getElementById('reset-btn');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const workModeBtn = document.getElementById('work-mode-btn');
        const breakModeBtn = document.getElementById('break-mode-btn');
        const sessionsCount = document.getElementById('sessions-count');
        const timeCount = document.getElementById('time-count');
        const sessionLabel = document.getElementById('session-label');
        const progressRing = document.getElementById('progress-ring');

        settingsBtn.addEventListener('click', () => {
            window.location.href = '{% url "settings:pomodoro" %}';
        });

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function updateDisplay() {
            timerDisplay.textContent = formatTime(timeLeft);
            const total = mode === 'work' ? WORK_TIME : BREAK_TIME;
            const offset = circumference - (timeLeft / total) * circumference;
            progressRing.style.strokeDashoffset = -offset;
        }

        function updateTimer() {
            if (endTime) {
                const remaining = Math.round((endTime - Date.now()) / 1000);
                if (remaining >= 0) {
                    timeLeft = remaining;
                    if (mode === 'work') {
                        const focusedSecondsSinceStart = (mode === 'work' ? WORK_TIME : BREAK_TIME) - timeLeft;
                        totalFocusedSeconds = parseInt(localStorage.getItem('totalFocusedSeconds') || 0) + focusedSecondsSinceStart;
                    }
                    updateDisplay();
                } else {
                    complete();
                }
            }
        }


        function updateStats() {
            sessionsCount.textContent = sessionsCompleted;
            const mins = Math.floor(totalFocusedSeconds / 60);
            timeCount.textContent = `${mins}m`;
        }

        function start() {
            if (isRunning) return;

            isRunning = true;
            playIcon.style.display = 'none';
            pauseIcon.style.display = 'block';

            const duration = mode === 'work' ? WORK_TIME : BREAK_TIME;
            if (endTime === null) {
                endTime = Date.now() + timeLeft * 1000;
            }

            localStorage.setItem('endTime', endTime);
            localStorage.setItem('isRunning', isRunning);
            localStorage.setItem('mode', mode);

            timerInterval = setInterval(updateTimer, 250);
        }

        function pause() {
            isRunning = false;
            clearInterval(timerInterval);
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
            localStorage.setItem('isRunning', isRunning);
            localStorage.setItem('timeLeft', timeLeft);
            localStorage.removeItem('endTime');
        }

        function complete() {
            pause();
            if (mode === 'work') {
                sessionsCompleted++;
                localStorage.setItem('sessionsCompleted', sessionsCompleted);
                const focusedSeconds = parseInt(localStorage.getItem('totalFocusedSeconds') || 0);
                localStorage.setItem('totalFocusedSeconds', focusedSeconds + WORK_TIME);
            }
            switchMode(mode === 'work' ? 'break' : 'work');
        }

        function switchMode(newMode) {
            mode = newMode;
            timeLeft = mode === 'work' ? WORK_TIME : BREAK_TIME;
            sessionLabel.textContent = mode;
            endTime = null;
            localStorage.setItem('mode', mode);
            localStorage.setItem('timeLeft', timeLeft);
            localStorage.removeItem('endTime');


            if (mode === 'work') {
                workModeBtn.className = "px-7 py-2 rounded-full text-[10px] font-bold tracking-[0.2em] transition-all bg-primary/20 text-primary border border-primary/30";
                breakModeBtn.className = "px-7 py-2 rounded-full text-[10px] font-bold tracking-[0.2em] transition-all text-neutral-content/40 hover:text-primary/70";
            } else {
                breakModeBtn.className = "px-7 py-2 rounded-full text-[10px] font-bold tracking-[0.2em] transition-all bg-primary/20 text-primary border border-primary/30";
                workModeBtn.className = "px-7 py-2 rounded-full text-[10px] font-bold tracking-[0.2em] transition-all text-neutral-content/40 hover:text-primary/70";
            }
            updateDisplay();
        }

        function loadState() {
            const savedEndTime = parseInt(localStorage.getItem('endTime'));
            const savedIsRunning = localStorage.getItem('isRunning') === 'true';
            const savedMode = localStorage.getItem('mode');
            const savedTimeLeft = parseInt(localStorage.getItem('timeLeft'));
            sessionsCompleted = parseInt(localStorage.getItem('sessionsCompleted') || 0);
            totalFocusedSeconds = parseInt(localStorage.getItem('totalFocusedSeconds') || 0);

            if (savedMode) {
                mode = savedMode;
            }

            if (savedIsRunning && savedEndTime) {
                const remaining = Math.round((savedEndTime - Date.now()) / 1000);
                if (remaining > 0) {
                    timeLeft = remaining;
                    endTime = savedEndTime;
                    start();
                } else {
                    timeLeft = savedTimeLeft || (mode === 'work' ? WORK_TIME : BREAK_TIME);
                    complete();
                }
            } else {
                timeLeft = savedTimeLeft || (mode === 'work' ? WORK_TIME : BREAK_TIME);
            }

            switchMode(mode);
            updateDisplay();
            updateStats();
        }

        window.addEventListener('beforeunload', () => {
            if (isRunning) {
                localStorage.setItem('timeLeft', timeLeft);
            }
        });

        startBtn.addEventListener('click', () => isRunning ? pause() : start());
        resetBtn.addEventListener('click', () => {
            pause();
            localStorage.removeItem('endTime');
            localStorage.removeItem('timeLeft');
            switchMode(mode);
        });
        workModeBtn.addEventListener('click', () => { if (!isRunning) switchMode('work'); });
        breakModeBtn.addEventListener('click', () => { if (!isRunning) switchMode('break'); });

        loadState();
    })();
</script>
{% endblock %}
