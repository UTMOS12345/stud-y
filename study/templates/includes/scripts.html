<script>
  // ── Clock ──
  function updateClock() {
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN',
      'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];

    document.getElementById('clock').textContent =
      `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    document.getElementById('datestamp').textContent =
      `${days[now.getDay()]} ${pad(now.getDate())} ${months[now.getMonth()]} ${now.getFullYear()}`;
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ── Sidebar toggle ──
  const sidebar = document.getElementById('sidebar');
  const toggleIcon = document.getElementById('toggle-icon');
  let expanded = false;

  document.getElementById('toggle-btn').addEventListener('click', () => {
    expanded = !expanded;
    sidebar.style.width = expanded ? '220px' : '52px';
    toggleIcon.style.transform = expanded ? 'rotate(180deg)' : 'rotate(0deg)';

    // fade labels in/out
    document.querySelectorAll('.sidebar-label').forEach(el => {
      el.style.opacity = expanded ? '1' : '0';
      el.style.pointerEvents = expanded ? 'auto' : 'none';
    });
  });

  // ── Profile dropdown ──
  const profileBtn = document.getElementById('profile-btn');
  const profileMenu = document.getElementById('profile-menu');

  profileBtn.addEventListener('click', e => {
    e.stopPropagation();
    const isOpen = profileMenu.style.display === 'block';
    profileMenu.style.display = isOpen ? 'none' : 'block';
  });

  document.addEventListener('click', () => {
    profileMenu.style.display = 'none';
  });

  profileMenu.addEventListener('click', e => e.stopPropagation());
</script>
