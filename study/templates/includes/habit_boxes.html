{# what makes habit boxes work, on any page that shows them: painting, saving and the percent picker #}
{# percent picker, shared by every percent box #}
<div id="hb-pop" class="hidden" role="dialog" aria-label="Set percent">
    <div class="flex items-baseline justify-between mb-3">
        <span id="hb-pop-date" class="text-[10px] uppercase tracking-[0.2em] text-neutral-content font-bold"></span>
        <span class="text-2xl font-bold text-base-content"><span id="hb-pop-value">0</span>%</span>
    </div>
    <input id="hb-pop-range" type="range" min="0" max="100" step="5" class="w-full cursor-pointer" aria-label="Percent">
    <div class="grid grid-cols-5 gap-1.5 mt-3">
        <button type="button" data-set="0">0</button><button type="button" data-set="25">25</button><button type="button" data-set="50">50</button><button type="button" data-set="75">75</button><button type="button" data-set="100">100</button>
    </div>
</div>

<style>
    .hb-cell {
        width: 100%; height: 58px; position: relative; cursor: pointer; border-radius: 8px;
        background: linear-gradient(to top, var(--c) var(--fill), color-mix(in srgb, var(--color-base-content), transparent 92%) var(--fill));
        transition: transform .1s;
    }
    .hb-cell:hover:not(:disabled) { transform: scale(1.1); z-index: 1; }
    .hb-cell:focus-visible { outline: 2px solid var(--color-base-content); outline-offset: 1px; }
    .hb-cell:disabled { cursor: default; background: transparent; border: 1px dashed color-mix(in srgb, var(--color-neutral-content), transparent 80%); }
    .hb-cell-today:not(:disabled) { box-shadow: 0 0 0 1.5px var(--color-primary); }
    .hb-cell[data-kind="percent"]::after {
        content: attr(data-shown); position: absolute; inset: 0; display: grid; place-items: center;
        font-size: 10px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .9), 0 0 3px rgba(0, 0, 0, .9);
    }
    .hb-cell.is-full:not([data-kind="percent"])::after {
        content: "✓"; position: absolute; inset: 0; display: grid; place-items: center;
        font-size: 15px; font-weight: 700; color: rgba(0, 0, 0, .65);
    }

    #hb-pop {
        position: fixed; z-index: 900; width: 230px; padding: 1rem;
        background: var(--color-base-200); border-radius: 1rem;
        border: 1px solid color-mix(in srgb, var(--color-primary), transparent 70%);
        box-shadow: 0 16px 40px rgba(0, 0, 0, .4);
    }
    #hb-pop button {
        cursor: pointer; font-size: 11px; font-weight: 700; padding: .35rem 0; border-radius: .5rem;
        color: var(--color-base-content); background: color-mix(in srgb, var(--color-base-content), transparent 92%);
    }
    #hb-pop button:hover { color: var(--color-primary); }
</style>

<script>
    (function () {
        const CSRF = '{{ csrf_token }}';

        // ── boxes ──────────────────────────────────────────────────────────
        function paint(cell, value) {
            cell.dataset.value = value;
            cell.style.setProperty('--fill', value + '%');
            cell.classList.toggle('is-full', value === 100);
            cell.dataset.shown = value ? value : '';
            cell.title = cell.dataset.label + (value ? ' · ' + value + '%' : '');
        }
        const cells = [...document.querySelectorAll('.hb-cell')];
        cells.forEach(cell => paint(cell, Number(cell.dataset.value)));

        // saves run one after another, so quick clicks can't arrive out of order
        let saving = Promise.resolve();
        function save(cell, value) {
            const before = Number(cell.dataset.value);
            paint(cell, value);
            saving = saving.then(async () => {
                try {
                    const response = await fetch(cell.dataset.url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF },
                        body: JSON.stringify({ date: cell.dataset.date, value: value }),
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error);
                    if (window.onHabitSaved) window.onHabitSaved(cell.dataset.habit, data);
                } catch (e) {
                    paint(cell, before);
                    toast(e.message || 'Could not save, check your connection', 'error');
                }
            });
        }

        const NEXT = {
            check: { 0: 100, 100: 0 },
            three: { 0: 50, 50: 100, 100: 0 },
        };

        // ── percent picker ─────────────────────────────────────────────────
        const pop = document.getElementById('hb-pop');
        const range = document.getElementById('hb-pop-range');
        const number = document.getElementById('hb-pop-value');
        let popCell = null;

        function closePop() {
            pop.classList.add('hidden');
            if (popCell) popCell.focus({ preventScroll: true });
            popCell = null;
        }

        function openPop(cell) {
            popCell = cell;
            document.getElementById('hb-pop-date').textContent = cell.dataset.label;
            range.value = cell.dataset.value;
            range.style.accentColor = getComputedStyle(cell).getPropertyValue('--c');
            number.textContent = cell.dataset.value;
            pop.classList.remove('hidden');
            const box = cell.getBoundingClientRect();
            const left = Math.max(8, Math.min(box.left + box.width / 2 - pop.offsetWidth / 2, innerWidth - pop.offsetWidth - 8));
            const below = box.bottom + 8;
            const top = below + pop.offsetHeight > innerHeight ? box.top - pop.offsetHeight - 8 : below;
            pop.style.left = left + 'px';
            pop.style.top = Math.max(8, top) + 'px';
            range.focus({ preventScroll: true });
        }

        function setPercent(value) {
            if (popCell && Number(popCell.dataset.value) !== value) save(popCell, value);
        }

        range.addEventListener('input', () => {
            number.textContent = range.value;
            if (popCell) popCell.style.setProperty('--fill', range.value + '%');
        });
        range.addEventListener('change', () => setPercent(Number(range.value)));
        pop.querySelectorAll('[data-set]').forEach(button => button.addEventListener('click', () => {
            setPercent(Number(button.dataset.set));
            closePop();
        }));

        cells.forEach(cell => cell.addEventListener('click', e => {
            e.stopPropagation();
            if (cell.dataset.kind === 'percent') {
                if (popCell === cell) closePop(); else openPop(cell);
                return;
            }
            closePop();
            save(cell, NEXT[cell.dataset.kind][Number(cell.dataset.value)]);
        }));
        document.addEventListener('click', e => { if (popCell && !pop.contains(e.target)) closePop(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape' && popCell) closePop(); });
        document.addEventListener('scroll', () => { if (popCell) closePop(); }, true);
    })();
</script>
