{% load static %}
<header class="bg-base-300 border-b border-neutral flex items-center justify-between px-10 z-20 relative flex-shrink-0"
    style="height:80px; min-height:80px;">

    <!-- clock + date -->
    <div class="flex items-end gap-4" style="padding-left: 12px;">
        <span id="clock" class="font-bold text-base-content leading-none tracking-tight"
            style="font-family:'Share Tech Mono', monospace; font-size:32px;">
            00:00:00
        </span>
        <span id="datestamp" class="text-[12px] text-neutral-content tracking-[0.1em] uppercase"
            style="margin-bottom:4px;">
            — —
        </span>
    </div>

    <!-- profile -->
    <div class="relative flex items-center gap-3">
        <!-- live dot -->
        <div class="w-2 h-2 rounded-full bg-primary flex-shrink-0" style="box-shadow: 0 0 8px rgba(77,255,170,0.65);">
        </div>

        <!-- profile button -->
        <button id="profile-btn"
            class="flex items-center gap-2.5 px-4 py-3 rounded-lg border border-neutral hover:border-neutral-content/40 transition-all group pointer-events-auto cursor-pointer"
            style="margin: 24px;">
            <div
                class="w-7 h-7 rounded-full bg-neutral flex items-center justify-center text-[11px] font-semibold text-neutral-content group-hover:text-primary transition-colors flex-shrink-0">
                {% if user.is_authenticated %}{{ user.username|first|upper }}{% else %}?{% endif %}
            </div>
            <span
                class="text-[12px] tracking-[0.04em] text-neutral-content group-hover:text-base-content transition-colors max-w-[120px] truncate">
                {% if user.is_authenticated %}{{ user.username }}{% else %}guest{% endif %}
            </span>
            <svg id="profile-chevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                class="text-neutral-content group-hover:text-primary flex-shrink-0 transition-transform">
                <polyline points="6 9 12 15 18 9" />
            </svg>
        </button>

        <!-- dropdown -->
        <div id="profile-menu" class="absolute right-0 rounded-xl overflow-hidden z-[100] hidden"
            style="top:calc(100% - 10px); width:280px; background-color: #0f1a17; border: 1px solid #26403a; box-shadow: 0 20px 60px rgba(0,0,0,0.85);">

            {% if user.is_authenticated %}
            <!-- user header -->
            <div class="flex flex-col items-center text-center p-6 border-b border-[#26403a]">
                <div
                    class="w-12 h-12 rounded-full bg-[#1c2d28] border border-[#26403a] flex items-center justify-center mb-3">
                    <span class="text-primary font-bold text-lg">{{ user.username|first|upper }}</span>
                </div>
                <p class="text-sm font-semibold text-base-content">{{ user.username }}</p>
                <p class="text-[11px] text-neutral-content/60">{{ user.email }}</p>
            </div>

            <!-- links -->
            <div class="py-2">
                <a href="{% url 'settings:profile' %}"
                    class="flex items-center gap-3 px-6 py-4 text-sm text-neutral-content hover:bg-[#1c2d28] hover:text-primary transition-all cursor-pointer">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                    Profile
                </a>

                <a href="{% url 'settings:profile' %}"
                    class="flex items-center gap-3 px-6 py-4 text-sm text-neutral-content hover:bg-[#1c2d28] hover:text-primary transition-all cursor-pointer">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3" />
                        <path
                            d="M12 2v2M12 20v2M2 12h2M20 12h2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
                    </svg>
                    Settings
                </a>
            </div>

            <!-- sign out -->
            <div class="border-t border-[#26403a] py-2">
                <a href="{% url 'logout' %}"
                    class="flex items-center gap-3 px-6 py-4 text-sm text-error/70 hover:bg-error/5 hover:text-error transition-all cursor-pointer">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                        <polyline points="16 17 21 12 16 7" />
                        <line x1="21" y1="12" x2="9" y2="12" />
                    </svg>
                    Sign out
                </a>
            </div>
            {% else %}
            <div class="p-2">
                <a href="{% url 'account_login' %}"
                    class="flex items-center justify-center p-3 text-sm text-neutral-content hover:text-primary transition-all cursor-pointer">
                    Sign in →
                </a>
            </div>
            {% endif %}
        </div>
    </div>
</header>

<script>
    (function () {
        // Clock
        const clockEl = document.getElementById('clock');
        const dateEl = document.getElementById('datestamp');
        const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
        const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
        const pad = n => String(n).padStart(2, '0');

        function tick() {
            const now = new Date();
            if (clockEl) clockEl.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
            if (dateEl) dateEl.textContent = `${days[now.getDay()]} ${pad(now.getDate())} ${months[now.getMonth()]} ${now.getFullYear()}`;
        }
        tick();
        setInterval(tick, 1000);

        // Dropdown Logic
        const btn = document.getElementById('profile-btn');
        const menu = document.getElementById('profile-menu');
        const chevron = document.getElementById('profile-chevron');

        if (btn && menu) {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const isHidden = menu.classList.contains('hidden');
                if (isHidden) {
                    menu.classList.remove('hidden');
                    chevron.style.transform = 'rotate(180deg)';
                } else {
                    menu.classList.add('hidden');
                    chevron.style.transform = 'rotate(0deg)';
                }
            });

            document.addEventListener('click', (e) => {
                if (!menu.contains(e.target) && !btn.contains(e.target)) {
                    menu.classList.add('hidden');
                    chevron.style.transform = 'rotate(0deg)';
                }
            });
        }
    })();
</script>
