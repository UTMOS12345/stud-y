{% load static %}
<header
    class="bg-base-300 border-b border-primary/10 flex items-center justify-between px-10 z-20 relative flex-shrink-0"
    style="height:80px; min-height:80px;">

    <div class="absolute bottom-0 left-0 h-1 transition-all duration-300 ease-out" id="progress-bar-container" style="background: linear-gradient(90deg, transparent, var(--color-primary), transparent);
                box-shadow: 0 0 15px var(--glow-color);
                width: 0%;
                height: 2px;
                z-index: 1;">
    </div>

    <div class="absolute bottom-0 left-0 h-px pointer-events-none opacity-0" id="flow-glow" style="width: 0%;
                background: var(--color-primary);
                box-shadow: 0 0 30px var(--color-primary), 0 0 60px var(--glow-color);
                filter: blur(2px);
                transition: opacity 0.3s ease;
                z-index: 1;">
    </div>

    <div class="flex items-end gap-4" style="padding-left: 12px;">
        <span id="clock" class="font-bold text-base-content leading-none tracking-tight"
            style="font-family:'Share Tech Mono', monospace; font-size:32px; filter: drop-shadow(0 0 8px var(--glow-color));">
            00:00:00
        </span>
        <span id="datestamp" class="text-[12px] text-base-content/40 tracking-[0.1em] uppercase"
            style="margin-bottom:4px;">
            — —
        </span>
    </div>

    <div class="relative flex items-center gap-3" style="z-index: 50;">
        <div class="w-2 h-2 rounded-full bg-primary flex-shrink-0" style="box-shadow: 0 0 8px var(--color-primary);">
        </div>

        <button id="profile-btn"
            class="flex items-center gap-2.5 px-4 py-3 rounded-lg border border-primary/10 bg-primary/5 hover:border-primary/40 transition-all group pointer-events-auto cursor-pointer"
            style="margin: 24px;">
            <div
                class="w-7 h-7 rounded-full bg-primary/10 border border-primary/20 flex items-center justify-center text-[11px] font-semibold text-primary group-hover:bg-primary/20 transition-colors flex-shrink-0">
                {% if user.is_authenticated %}{{ user.username|first|upper }}{% else %}?{% endif %}
            </div>
            <span
                class="text-[12px] tracking-[0.04em] text-base-content/70 group-hover:text-primary transition-colors max-w-[120px] truncate">
                {% if user.is_authenticated %}{{ user.username }}{% else %}guest{% endif %}
            </span>
            <svg id="profile-chevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                class="text-base-content/30 group-hover:text-primary flex-shrink-0 transition-transform">
                <polyline points="6 9 12 15 18 9" />
            </svg>
        </button>

        <div id="profile-menu" class="absolute right-0 rounded-xl overflow-hidden z-50 hidden"
            style="top:calc(100% + 8px); width:280px; background-color: var(--color-base-200); border: 1px solid var(--color-primary); border-opacity: 0.1; box-shadow: 0 20px 60px rgba(0,0,0,0.5); backdrop-filter: blur(20px);">

            {% if user.is_authenticated %}
            <div class="flex flex-col items-center text-center p-6 border-b border-primary/10">
                <div
                    class="w-12 h-12 rounded-full bg-primary/10 border border-primary/20 flex items-center justify-center mb-3">
                    <span class="text-primary font-bold text-lg">{{ user.username|first|upper }}</span>
                </div>
                <p class="text-sm font-semibold text-base-content">{{ user.username }}</p>
                <p class="text-[11px] text-base-content/40">{{ user.email }}</p>
            </div>

            <div class="py-2">
                <a href="{% url 'settings:profile' %}"
                    class="flex items-center gap-3 px-6 py-4 text-sm text-base-content/70 hover:bg-primary/10 hover:text-primary transition-all cursor-pointer">
                    <i data-lucide="user" class="w-4 h-4"></i>
                    Profile
                </a>
                <a href="{% url 'settings:profile' %}"
                    class="flex items-center gap-3 px-6 py-4 text-sm text-base-content/70 hover:bg-primary/10 hover:text-primary transition-all cursor-pointer">
                    <i data-lucide="settings" class="w-4 h-4"></i>
                    Settings
                </a>
            </div>

            <div class="border-t border-primary/10 py-2">
                <a href="{% url 'logout' %}"
                    class="flex items-center gap-3 px-6 py-4 text-sm text-error/70 hover:bg-error/5 hover:text-error transition-all cursor-pointer">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                    Sign out
                </a>
            </div>
            {% else %}
            <div class="p-2 text-center">
                <a href="{% url 'account_login' %}"
                    class="flex items-center justify-center p-3 text-sm text-primary hover:bg-primary/5 rounded-lg transition-all cursor-pointer">
                    Sign in →
                </a>
            </div>
            {% endif %}
        </div>
    </div>
</header>

<style>
    @keyframes flow-pulse {
        0% {
            box-shadow: 0 0 20px var(--glow-color);
        }

        50% {
            box-shadow: 0 0 40px var(--color-primary);
        }

        100% {
            box-shadow: 0 0 20px var(--glow-color);
        }
    }

    #flow-glow.active {
        animation: flow-pulse 1.5s ease-in-out infinite;
    }

    #progress-bar-container.active {
        background: linear-gradient(90deg,
                transparent 0%,
                var(--color-primary) 50%,
                transparent 100%);
        background-size: 200% 100%;
    }
</style>
<script>
    (function () {
        // Clock
        const clockEl = document.getElementById('clock');
        const dateEl = document.getElementById('datestamp');
        const progressBar = document.getElementById('progress-bar-container');
        const flowGlow = document.getElementById('flow-glow');
        const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
        const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
        const pad = n => String(n).padStart(2, '0');

        function tick() {
            const now = new Date();
            if (clockEl) clockEl.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
            if (dateEl) dateEl.textContent = `${days[now.getDay()]} ${pad(now.getDate())} ${months[now.getMonth()]} ${now.getFullYear()}`;
        }
        tick();
        setInterval(tick, 1000);

        // Pomodoro Progress Bar - Update every 250ms to match timer
        function updateProgressBar() {
            const isRunning = localStorage.getItem('pomodoro_isRunning') === 'true';
            const mode = localStorage.getItem('pomodoro_mode') || 'work';
            const timeLeft = parseInt(localStorage.getItem('pomodoro_timeLeft')) || 0;

            const WORK_TIME = 25 * 60;
            const BREAK_TIME = 5 * 60;
            const totalTime = mode === 'work' ? WORK_TIME : BREAK_TIME;

            if (isRunning && timeLeft >= 0 && totalTime > 0) {
                // Calculate progress percentage (inverse so it fills as time decreases)
                const progress = ((totalTime - timeLeft) / totalTime) * 100;
                progressBar.style.width = progress + '%';

                // Show glow effect
                flowGlow.style.width = progress + '%';

                // Add active animations when timer is running
                progressBar.classList.add('active');
                flowGlow.classList.add('active');
                flowGlow.style.opacity = '1';

                // Make progress bar more visible when timer is low (last 25%)
                if (timeLeft < totalTime * 0.25) {
                    progressBar.style.height = '3px';
                    progressBar.style.boxShadow = `0 0 20px rgba(77, 255, 170, 0.8), 0 0 40px rgba(77, 255, 170, 0.6), inset 0 0 20px rgba(77, 255, 170, 0.3)`;
                } else {
                    progressBar.style.height = '2px';
                    progressBar.style.boxShadow = 'none';
                }
            } else {
                // Reset when timer is not running
                progressBar.style.width = '0%';
                progressBar.style.height = '2px';
                progressBar.style.boxShadow = 'none';
                progressBar.classList.remove('active');

                flowGlow.style.width = '0%';
                flowGlow.style.opacity = '0';
                flowGlow.classList.remove('active');
            }
        }

        // Update progress bar every 250ms to match pomodoro timer
        updateProgressBar();
        setInterval(updateProgressBar, 250);

        // Dropdown Logic
        const btn = document.getElementById('profile-btn');
        const menu = document.getElementById('profile-menu');
        const chevron = document.getElementById('profile-chevron');

        if (btn && menu) {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const isHidden = menu.classList.contains('hidden');
                if (isHidden) {
                    menu.classList.remove('hidden');
                    chevron.style.transform = 'rotate(180deg)';
                } else {
                    menu.classList.add('hidden');
                    chevron.style.transform = 'rotate(0deg)';
                }
            });

            document.addEventListener('click', (e) => {
                if (!menu.contains(e.target) && !btn.contains(e.target)) {
                    menu.classList.add('hidden');
                    chevron.style.transform = 'rotate(0deg)';
                }
            });
        }
    })();
</script>
