{% load static %}
<aside id="sidebar" class="h-screen bg-base-300 border-r border-neutral flex flex-col
              relative z-20 select-none overflow-hidden flex-shrink-0"
    style="width:52px; transition: width 0.28s cubic-bezier(0.16,1,0.3,1);">

    <!-- logo + toggle -->
    <div class="flex items-center justify-between px-3 border-b border-neutral" style="height:52px; min-height:52px;">

        <a href="/" class="flex items-center gap-2 overflow-hidden">
            <span class="font-serif italic font-bold text-base-content leading-none flex-shrink-0"
                style="font-size:22px;">s</span>
            <span class="sidebar-label font-serif italic font-bold text-base-content" style="font-size:18px; opacity:0; white-space:nowrap;
                   transition:opacity 0.18s ease; pointer-events:none;">
                tud-y
            </span>
        </a>

        <button id="toggle-btn" class="flex-shrink-0 w-7 h-7 flex items-center justify-center rounded
                   text-neutral-content hover:text-primary hover:bg-neutral/30 transition-colors">
            <svg id="toggle-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                style="transition: transform 0.28s cubic-bezier(0.16,1,0.3,1);">
                <polyline points="9 18 15 12 9 6" />
            </svg>
        </button>
    </div>

    <!-- nav links -->
    <nav class="flex-1 flex flex-col gap-0.5 pt-3 px-2 overflow-y-auto overflow-x-hidden">

        {# ── Add nav items here as you build pages ── #}
        {# Example:
        <a href="{% url 'dashboard' %}" class="flex items-center gap-3 px-2 py-2 rounded text-neutral-content
              hover:text-primary hover:bg-neutral/20 transition-colors">
            <svg class="flex-shrink-0 w-4 h-4" ... />
            <span class="sidebar-label text-[12px] tracking-[0.08em] uppercase"
                style="opacity:0; white-space:nowrap; transition:opacity 0.18s ease;">
                Dashboard
            </span>
        </a>
        #}

        <div class="sidebar-label px-2 pt-1" style="opacity:0; white-space:nowrap; transition:opacity 0.18s ease;">
            <p class="text-[9px] tracking-[0.16em] uppercase text-neutral-content/40 mb-1">
                Navigation
            </p>
            <p class="text-[11px] text-neutral-content/30 leading-relaxed">
                Empty for now.
            </p>
        </div>

    </nav>

    <!-- bottom settings -->
    <div class="border-t border-neutral px-2 py-3">
        <a href="#" class="flex items-center gap-3 px-2 py-2 rounded text-neutral-content
              hover:text-primary hover:bg-neutral/20 transition-colors">
            <svg class="flex-shrink-0 w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3" />
                <path d="M12 2v2M12 20v2M2 12h2M20 12h2
                 M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41
                 M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
            </svg>
            <span class="sidebar-label text-[12px] tracking-[0.08em] uppercase"
                style="opacity:0; white-space:nowrap; transition:opacity 0.18s ease;">
                Settings
            </span>
        </a>
    </div>

</aside>
