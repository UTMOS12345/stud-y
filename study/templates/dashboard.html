{% extends "base.html" %}
{% load i18n %}

{% block title %}stud-y — dashboard{% endblock %}

{% block content %}
<div class="h-full flex items-center justify-center p-8 animate-up">

    <div class="flex flex-col items-center gap-6 text-center max-w-sm">

        <!-- pulsing dot -->
        <div class="relative flex items-center justify-center">
            <div class="w-2 h-2 rounded-full bg-primary" style="box-shadow: 0 0 12px rgba(77,255,170,0.7);
                  animation: pulse 2.4s ease-in-out infinite;"></div>
            <div class="absolute w-8 h-8 rounded-full border border-primary/20"
                style="animation: ping 2.4s ease-in-out infinite;"></div>
        </div>

        <!-- heading -->
        <div>
            <h1 class="font-serif italic font-bold text-base-content leading-tight mb-2"
                style="font-size: 36px; letter-spacing: -0.4px;">
                coming soon.
            </h1>
            <p class="text-[11px] text-neutral-content tracking-[0.1em] uppercase">
                dashboard is under construction
            </p>
        </div>

        <!-- divider -->
        <div class="w-16 h-px bg-neutral"></div>

        <!-- status tags -->
        <div class="flex items-center gap-2">
            <span class="px-2 py-1 rounded text-[9px] tracking-[0.12em] uppercase
                   border border-primary/20 text-primary/70" style="background: rgba(77,255,170,0.04);">
                in progress
            </span>
            <span class="px-2 py-1 rounded text-[9px] tracking-[0.12em] uppercase
                   border border-neutral text-neutral-content/50">
                v0.1
            </span>
        </div>

    </div>

</div>

<style>
    @keyframes pulse {

        0%,
        100% {
            opacity: 1;
            transform: scale(1);
        }

        50% {
            opacity: 0.5;
            transform: scale(0.85);
        }
    }

    @keyframes ping {
        0% {
            transform: scale(0.8);
            opacity: 0.6;
        }

        80%,
        100% {
            transform: scale(2.2);
            opacity: 0;
        }
    }
</style>
{% endblock %}
